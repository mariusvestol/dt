<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Downtown VIP – Marius Vestøl.">
    <title>Downtown VIP – Marius Vestøl</title>
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="vip-card" aria-label="Downtown VIP">
      <img class="logo" src="assets/logo.png" alt="Club Downtown" width="700" height="190">

      <p class="date">
        <span class="visually-hidden">Dagens dato: </span>
        <time id="today"></time>
      </p>
      <noscript><p class="notice">Aktiver JavaScript for å vise dagens dato.</p></noscript>

      <img class="vip-badge" src="assets/vip-badge.png" alt="VIP" width="721" height="717">

      <div class="nameplate">
        <h1>Marius Vestøl</h1>
      </div>

      <p class="benefits">Pluss <strong>1</strong> stk og gratis inngang</p>

      <div class="check-in-area" aria-live="polite" aria-atomic="true">
        <button id="check-in" class="check-in" type="button" disabled>
          <img src="assets/checkin-button.png" alt="Sjekk inn" width="170" height="70">
        </button>
        <p id="check-in-status" class="check-in-status" tabindex="-1" hidden>Kan sjekke inn: <time id="check-in-time"></time></p>
      </div>

      <p class="instructions">
        <em>Innsjekk gjøres av dørvakt<br>og dere må komme samlet.<br>
          <strong>* Du MÅ vise legitimasjon</strong>
        </em>
      </p>
    </main>
  </body>
</html>
